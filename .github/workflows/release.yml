name: Release

# Al subir una etiqueta vX.Y.Z, publica releases/vX.Y.Z/ como release de GitHub.
# La carpeta la arma `python -m clasificador.release vX.Y.Z <experimento>`.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar que exista la carpeta del release
        run: |
          test -f "releases/${GITHUB_REF_NAME}/LEEME.md" || {
            echo "Falta releases/${GITHUB_REF_NAME}/. Córrelo con: python -m clasificador.release ${GITHUB_REF_NAME} <experimento>"; exit 1; }
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" releases/"${GITHUB_REF_NAME}"/* \
            --title "${GITHUB_REF_NAME}" --notes-file "releases/${GITHUB_REF_NAME}/LEEME.md"
